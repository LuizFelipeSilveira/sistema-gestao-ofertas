<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - JGP Crédito</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0;">

    <div class="app">

        <div class="sidebar">
            <div class="div_logo">
                <img class="logo" src="img/jgp_logo.png" alt="logo">
            </div>
            <div class="div_botoes">
                <button class="botao" type="button" onclick="navegar('dashboard')">DASHBOARD</button>
                <button class="botao" type="button" onclick="navegar('emissoes')">EMISSÕES</button>
            </div>

            <div class="div_stats">
                <div class="item_stats">
                    <span class="label_stats">TOTAL EMISSÕES</span>
                    <span class="value_stats" id="quantidade">...</span>
                </div>
                <div class="item_stats">
                    <span class="label_stats">VALOR TOTAL</span>
                    <span class="value_stats" id="valor_total">...</span>
                </div>
                <div class="item_stats">
                    <span class="label_stats">TICKET MÉDIO</span>
                    <span class="value_stats" id="ticket_medio">...</span>
                </div>
            </div>
        </div>

        <main class="content">
            <img class="icon" src="img/icon_credito.png" alt="logo">
            <section id="dashboard">
                <header>
                    <h1>DASHBOARD</h1>
                </header>
            </section>
            <section id="emissoes">
                <header>
                    <h1>EMISSÕES</h1>
                </header>
            </section>
        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
